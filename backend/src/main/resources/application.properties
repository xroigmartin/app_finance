spring.application.name=finance-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://${FINANCE_DB_HOST:localhost}:${FINANCE_DB_PORT:5432}/${FINANCE_DB_NAME:finance}
spring.datasource.username=${FINANCE_DB_USER:finance}
spring.datasource.password=${FINANCE_DB_PASSWORD:finance}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sembrar datos de demostracion en el primer arranque (cuentas y 12 meses de movimientos)
finance.seed-demo=${FINANCE_SEED_DEMO:true}

server.error.include-message=always
spring.mvc.problemdetails.enabled=true
