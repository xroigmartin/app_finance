spring.application.name=finance-backend
server.port=${FINANCE_BACKEND_PORT:8080}

spring.datasource.url=jdbc:postgresql://${FINANCE_DB_HOST:localhost}:${FINANCE_DB_PORT:5432}/${FINANCE_DB_NAME:finance}
spring.datasource.username=${FINANCE_DB_USER:finance}
spring.datasource.password=${FINANCE_DB_PASSWORD:finance}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.error.include-message=always
spring.mvc.problemdetails.enabled=true

# Sin exporter configurado todavia (docs/prd/observabilidad.md RF-6): nada sale por
# red, así que muestrear al 100% no tiene coste y da trace_id/span_id en todo log.
management.tracing.sampling.probability=1.0
# spring-boot-starter-opentelemetry activa por defecto un push de métricas OTLP a
# localhost:4318 (ausente en dev): sin collector solo genera reintentos fallidos
# cada minuto. Se deja desactivado hasta que exista un collector real (SigNoz).
management.otlp.metrics.export.enabled=false

# Los informes Flex anuales de IBKR rondan 1,5 MB (> limite por defecto de 1 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
