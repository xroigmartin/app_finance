spring.application.name=finance-backend
server.port=8080

# Por defecto apunta a la BD de desarrollo (db-dev, puerto host 5433); producción inyecta FINANCE_DB_* en compose
spring.datasource.url=jdbc:postgresql://${FINANCE_DB_HOST:localhost}:${FINANCE_DB_PORT:5433}/${FINANCE_DB_NAME:finance}
spring.datasource.username=${FINANCE_DB_USER:finance}
spring.datasource.password=${FINANCE_DB_PASSWORD:finance}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.error.include-message=always
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
